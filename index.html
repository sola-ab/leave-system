<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbyK8JhC6Qo9iCj0JE8Q9kLltSTmMc0jMF2vvFkPJi1YgU4gS415n9rYpSVStbjFHV-G4A/exec">
  <title>ระบบการลา</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #f3f6fb; color: #172033;
      font-family: system-ui, sans-serif; text-align: center;
    }
    main {
      width: min(440px, 100%); padding: 36px 28px;
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 18px; box-shadow: 0 12px 36px #0f172a12;
    }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }
    a {
      display: inline-block; padding: 12px 22px; border-radius: 10px;
      background: #2563eb; color: #fff; text-decoration: none; font-weight: 600;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>ระบบการลา</h1>
    <p>กำลังเปิดระบบ หากไม่เปลี่ยนหน้าโดยอัตโนมัติ ให้กดปุ่มด้านล่าง</p>
    <a href="https://script.google.com/macros/s/AKfycbyK8JhC6Qo9iCj0JE8Q9kLltSTmMc0jMF2vvFkPJi1YgU4gS415n9rYpSVStbjFHV-G4A/exec">เปิดระบบการลา</a>
  </main>
</body>
</html>
